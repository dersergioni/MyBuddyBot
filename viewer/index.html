<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Response Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ============================================================
           Dark theme (default fallback when outside Telegram)
           ============================================================ */
        :root {
            --bg: #1a1a2e;
            --text: #e0e0e0;
            --text-secondary: #999;
            --text-strong: #fff;
            --accent: #4fc3f7;
            --code-bg: #0d1117;
            --block-bg: #16213e;
            --border: #333;
            --table-header-bg: rgba(255,255,255,0.08);
            --table-row-alt-bg: rgba(255,255,255,0.03);
            --code-header-bg: #21262d;
            --code-header-text: #8b949e;
            --hljs-theme: "dark";
        }

        /* ============================================================
           Light theme
           ============================================================ */
        body.theme-light {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --text-strong: #000;
            --accent: #0366d6;
            --code-bg: #f6f8fa;
            --block-bg: #f0f4f8;
            --border: #d0d7de;
            --table-header-bg: rgba(0,0,0,0.06);
            --table-row-alt-bg: rgba(0,0,0,0.02);
            --code-header-bg: #f0f3f6;
            --code-header-text: #57606a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, var(--bg));
            color: var(--tg-theme-text-color, var(--text));
            padding: 16px;
            line-height: 1.6;
            font-size: 15px;
            -webkit-text-size-adjust: 100%;
        }

        h1 { font-size: 1.5em; margin: 20px 0 12px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        h2 { font-size: 1.3em; margin: 18px 0 10px; color: var(--accent); }
        h3 { font-size: 1.1em; margin: 14px 0 8px; }

        p { margin: 8px 0; }

        strong { color: var(--text-strong); }

        code {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
            font-size: 0.88em;
        }

        :not(pre) > code {
            background: var(--tg-theme-secondary-bg-color, var(--code-bg));
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        pre {
            position: relative;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        pre code {
            display: block;
            padding: 14px;
            overflow-x: auto;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--code-header-bg);
            padding: 6px 14px;
            font-size: 12px;
            color: var(--code-header-text);
            border-radius: 8px 8px 0 0;
        }

        .code-header + code { border-radius: 0 0 8px 8px; }

        .copy-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--code-header-text);
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .copy-btn:active { background: var(--accent); color: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 14px;
            overflow-x: auto;
            display: block;
        }

        th, td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            text-align: left;
        }

        th { background: var(--table-header-bg); font-weight: 600; }
        tr:nth-child(even) { background: var(--table-row-alt-bg); }

        blockquote {
            border-left: 3px solid var(--accent);
            padding: 8px 14px;
            margin: 10px 0;
            background: var(--tg-theme-secondary-bg-color, var(--block-bg));
            border-radius: 0 6px 6px 0;
        }

        ul, ol { padding-left: 24px; margin: 8px 0; }
        li { margin: 4px 0; }

        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 8px 0; }
        .katex { font-size: 1.1em; color: var(--tg-theme-text-color, var(--text)); }

        hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

        a { color: var(--tg-theme-link-color, var(--accent)); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .response-meta {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div id="response-date" class="response-meta" style="text-align:left; border-top:none; margin-top:0; padding-top:0; margin-bottom:12px;"></div>
    <div id="content"></div>
    <div class="response-meta">MyBuddyBot — AI Response Viewer</div>

    <script>
        // Protect LaTeX from marked: extract, replace with placeholders, restore after
        function protectLatex(text) {
            const placeholders = [];
            // Order matters: match $$ before $, and \\[...\\] before \\(...\\)
            const patterns = [
                /\$\$([\s\S]*?)\$\$/g,
                /\\\[([\s\S]*?)\\\]/g,
                /\$([^\n$]+?)\$/g,
                /\\\((.*?)\\\)/g
            ];
            const delims = [['$$','$$'], ['\\[','\\]'], ['$','$'], ['\\(','\\)']];

            for (let i = 0; i < patterns.length; i++) {
                text = text.replace(patterns[i], (match, inner) => {
                    const id = `%%LATEX_${placeholders.length}%%`;
                    placeholders.push({ id, left: delims[i][0], right: delims[i][1], inner });
                    return id;
                });
            }
            return { text, placeholders };
        }

        function restoreLatex(html, placeholders) {
            for (const p of placeholders) {
                html = html.replace(p.id, `${p.left}${p.inner}${p.right}`);
            }
            return html;
        }

        function renderContent(markdown) {
            // Configure marked
            marked.setOptions({
                gfm: true,
                breaks: false
            });

            // Render: protect LaTeX -> parse markdown -> restore LaTeX
            const { text: safeText, placeholders } = protectLatex(markdown);
            const html = restoreLatex(marked.parse(safeText), placeholders);
            document.getElementById('content').innerHTML = html;

            // Add copy buttons and language labels to code blocks
            document.querySelectorAll('pre code').forEach((block) => {
                const lang = block.className.replace('language-', '') || 'code';
                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `<span>${lang}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button>`;
                block.parentNode.insertBefore(header, block);

                hljs.highlightElement(block);
            });

            // Render LaTeX
            renderMathInElement(document.getElementById('content'), {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false
            });
        }

        // Copy function
        function copyCode(btn) {
            const code = btn.closest('.code-header').nextElementSibling.textContent;
            navigator.clipboard.writeText(code).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            });
        }

        // Load response by ID from URL params
        async function loadResponse() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.getElementById('content').innerHTML = '<p>No response ID provided.</p>';
                return;
            }

            try {
                const response = await fetch(`./responses/${id}.json`);
                if (!response.ok) {
                    throw new Error(`Response not found (${response.status})`);
                }
                const data = await response.json();
                if (data.timestamp) {
                    const date = new Date(data.timestamp);
                    document.getElementById('response-date').textContent =
                        date.toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' }) +
                        ', ' + date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                }
                renderContent(data.content);
            } catch (e) {
                document.getElementById('content').innerHTML =
                    `<p>Failed to load response: ${e.message}</p>`;
            }
        }

        // Telegram Web App integration + theme detection
        function applyTheme(scheme) {
            const isLight = scheme === 'light';
            document.body.classList.toggle('theme-light', isLight);

            // Switch highlight.js theme
            const hljsLink = document.getElementById('hljs-theme');
            if (hljsLink) {
                hljsLink.href = isLight
                    ? 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css'
                    : 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css';
            }
        }

        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            applyTheme(tg.colorScheme);
            tg.onEvent('themeChanged', () => applyTheme(tg.colorScheme));
        }

        loadResponse();
    </script>
</body>
</html>
